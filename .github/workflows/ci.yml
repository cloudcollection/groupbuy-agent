name: Validate public pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare test temporary storage
        shell: pwsh
        run: |
          $taskTemp = Join-Path $env:GITHUB_WORKSPACE 'runtime/ci-tmp'
          New-Item -ItemType Directory -Force $taskTemp | Out-Null
          "GB_TEMP_DIR=$taskTemp" >> $env:GITHUB_ENV
          "TEMP=$taskTemp" >> $env:GITHUB_ENV
          "TMP=$taskTemp" >> $env:GITHUB_ENV
          "TMPDIR=$taskTemp" >> $env:GITHUB_ENV
          "PIP_CACHE_DIR=$taskTemp/pip-cache" >> $env:GITHUB_ENV
      - name: Synthetic core and policy tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python -B -m unittest discover -s tests -v
      - name: Publication scan
        run: python -B tools/release_check.py
