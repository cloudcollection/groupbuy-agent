[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groupbuy-agent"
version = "0.4.0"
description = "Standalone AI tool loop and auditable public group-buying collection pipeline"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
dependencies = []

[project.optional-dependencies]
windows = ["pywinauto==0.6.9", "pywin32>=306", "rapidocr-onnxruntime>=1.3,<2", "Pillow>=10", "psutil>=5"]

[project.scripts]
groupbuy = "groupbuy.__main__:main"

[tool.setuptools.packages.find]
include = ["groupbuy*"]

[tool.setuptools.package-data]
groupbuy = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg"]
